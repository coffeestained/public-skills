<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C4 diagrams</title>
<style>
/* Light mode only, same palette as diagram.html. */
:root { --bg: #f5f6f8; --card: #fff; --ink: #1b2330; --muted: #5f6b7a; --line: #d9dee6;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 16px rgba(16,24,40,.07); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); padding: 24px;
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
h1 { margin: 0 0 4px; font-size: 20px; }
.sub { color: var(--muted); margin-bottom: 20px; }
.pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; max-width: 1100px; }
a.page { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
  box-shadow: var(--shadow); text-decoration: none; color: inherit; }
a.page:hover { border-color: #2f6fed; }
a.page b { display: block; font-size: 15px; }
a.page .lvl { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
a.page p { margin: 8px 0 0; color: var(--muted); font-size: 12.5px; }
footer { margin-top: 24px; color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<h1 id="title"></h1>
<div class="sub" id="sub"></div>
<div class="pages" id="pages"></div>
<footer>C4 model · <a href="model.json">model.json</a></footer>
<script>
// PAGES lists the rendered files in reading order: context, container, then component pages.
const MODEL = /*__MODEL__*/{};
const PAGES = /*__PAGES__*/[];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
document.title = `C4 diagrams: ${MODEL.project || ""}`;
document.getElementById("title").textContent = `C4 diagrams: ${MODEL.project || ""}`;
document.getElementById("sub").textContent = MODEL.description || "";
document.getElementById("pages").innerHTML = PAGES.map(p =>
  `<a class="page" href="${esc(p.file)}"><b>${esc(p.title)}</b><div class="lvl">${esc(p.level)}</div><p>${esc(p.summary)}</p></a>`).join("");
</script>
</body>
</html>
