<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design document</title>
<style>
/* @shared:begin tokens.css (edit shared/tokens.css, then run tools/stamp.py) */
/* Light mode only. These are documents: they get printed and pasted into wikis. */
:root {
  --bg: #f5f6f8; --card: #ffffff; --ink: #1b2330; --muted: #5f6b7a; --line: #d9dee6;
  --wire: #7a8798; --boundary: #eef2f8; --boundary-line: #b9c4d4;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 16px rgba(16,24,40,.07);
}
/* @shared:end tokens.css */
/* @shared:begin page.css (edit shared/page.css, then run tools/stamp.py) */
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
a { color: inherit; }
header { padding: 22px 24px 6px; }
header h1 { margin: 0; font-size: 20px; }
header .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
/* Scope / primary / audience: every page says what it covers and for whom. */
.meta { display: flex; flex-wrap: wrap; gap: 6px 22px; padding: 10px 24px 0; font-size: 12px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; margin-right: 4px; }
nav.crumbs { padding: 6px 24px 0; font-size: 12px; color: var(--muted); }
section { padding: 20px 24px 0; }
section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }

table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; font-size: 12.5px; }
th, td { text-align: left; padding: 8px 10px; border-top: 1px solid #eef1f5; vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: #fafbfc; border-top: 0; }
td .tech { color: var(--muted); font-size: 11px; }
.wrap { border-radius: 10px; overflow: auto; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 7px;
  border-radius: 5px; border: 1px solid; }
.chip svg { width: 11px; height: 11px; }
/* One colour per tag category, all readable on white. */
.chip.tech   { color: #9a4a0b; background: #fff3e8; border-color: #f3c7a0; }
.chip.region { color: #1d4ed8; background: #eaf0ff; border-color: #b7c7fb; }
.chip.env    { color: #92400e; background: #fff8e1; border-color: #f2d58a; }
.chip.team   { color: #166534; background: #ecfdf3; border-color: #a7e3bd; }
.chip.risk   { color: #b42318; background: #fef3f2; border-color: #f4b6b0; }
.chip.other  { color: #475467; background: #f2f4f7; border-color: #d0d5dd; }
/* Severity of a threat, impact of a risk. */
.chip.critical { color: #fff; background: #b42318; border-color: #b42318; }
.chip.high { color: #b42318; background: #fef3f2; border-color: #f4b6b0; }
.chip.medium { color: #92400e; background: #fff8e1; border-color: #f2d58a; }
.chip.low { color: #166534; background: #ecfdf3; border-color: #a7e3bd; }

/* Tile colours by element kind. Matches the key. */
.k-person { background: #6c5ce7; } .k-system { background: #2f6fed; } .k-external { background: #6b7280; }
.k-app { background: #e8822a; } .k-web { background: #1f9ad6; } .k-mobile { background: #1f9ad6; }
.k-store { background: #3b9c5c; } .k-queue { background: #c99700; } .k-function { background: #d9532b; }
.k-component { background: #4b7bec; }

/* Key. */
.legend { margin: 8px 24px 28px; display: inline-block; border: 1px solid var(--line); background: var(--card);
  border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow); font-size: 12px; }
.legend h2 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.legend .items { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
footer { padding: 0 24px 24px; color: var(--muted); font-size: 11px; }
/* The page's one tooltip. Anything carrying data-tip shows it. */
[data-tip] { cursor: help; }
.tip { position: fixed; z-index: 20; max-width: 340px; padding: 8px 10px; border-radius: 8px; background: var(--ink); color: #fff;
  font-size: 12px; line-height: 1.4; box-shadow: 0 6px 20px rgba(16,24,40,.25); pointer-events: none; }
.tip b { display: block; margin-bottom: 2px; }
.tip .t { color: #b8c2d0; font-size: 11px; margin-top: 2px; }
@media print {
  :root { --shadow: none; }
  html, body { background: #fff; }
  .tip { display: none; }
  @page { margin: 12mm; }
}
/* @shared:end page.css */
/* @shared:begin diagram.css (edit shared/diagram.css, then run tools/stamp.py) */
/* Diagram: a positioned stage so SVG wires can sit over the cards. It is its own size container,
   so a diagram lays out for the column it is in, not for the window. */
.stage { position: relative; padding: 18px 24px 24px; --gap: 90px; container-type: inline-size; }
/* Wires sit above the cards; label pills are opaque so they still read where they cross. */
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 3; }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px 40px; }
.row.people { margin-bottom: calc(var(--gap) - 16px); }
.row.people:empty { margin: 0; }   /* a view with no people leaves no gap for them */
.mid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 150px; align-items: start; }
.mid.no-side { grid-template-columns: minmax(0, 1fr); }
.boundary { position: relative; border: 1.5px dashed var(--boundary-line); border-radius: 12px;
  background: var(--boundary); padding: 40px 28px 28px; }
.boundary .blabel { position: absolute; top: 10px; left: 14px; font-size: 12px; color: var(--muted); }
.boundary .blabel b { color: var(--ink); font-weight: 600; }
.layers { display: flex; flex-direction: column; gap: var(--gap); }
.layer { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px 44px; }
.side { display: flex; flex-direction: column; gap: var(--gap); padding-top: 8px; }
.side .slabel { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: -22px; }
@container (max-width: 812px) {
  .mid { grid-template-columns: minmax(0, 1fr); gap: var(--gap); }
  .row, .layer { gap: 28px; }
  .boundary { padding: 40px 14px 20px; }
}

/* Element card: icon, name, [Type: Tech], description, chips. */
.card { position: relative; width: 250px; max-width: 100%; background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow); padding: 26px 14px 12px; }
.card.person { border-radius: 16px 16px 10px 10px; }
.card.external { border-style: dashed; background: #fbfbfc; }
.card .badge { position: absolute; top: 7px; font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.card .badge.tl { left: 10px; } .card .badge.tr { right: 10px; }
.card .badge a { text-decoration: none; color: inherit; }
.card .badge svg { width: 12px; height: 12px; }
.card .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #36b37e; display: inline-block; }
.card .head { display: flex; align-items: center; gap: 10px; }
.card .tile { flex: 0 0 36px; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: #fff; }
.card .tile svg { width: 20px; height: 20px; }
.card .name { font-weight: 700; font-size: 15px; line-height: 1.2; }
.card .type { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.card .desc { color: var(--ink); font-size: 12.5px; margin-top: 8px; }
.card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.card .lock { color: #9aa5b4; width: 13px; height: 13px; margin-left: auto; }
.card .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #eef1f5; }

/* Wires: orthogonal with rounded corners, one arrowhead, label in a white pill. */
.wire { fill: none; stroke: var(--wire); stroke-width: 1.4; }
.hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; }   /* a wide, unseen line to point at */
.wl { pointer-events: all; }
.wlabel-bg { fill: #fff; stroke: var(--line); rx: 4; }
.wlabel { font-size: 11px; fill: var(--ink); }
.wlabel .tech { fill: var(--muted); font-size: 10px; }
/* Pointing at a wire or a card lights what it connects and quiets the rest. */
.w, .wl, .card { transition: opacity .12s; }
.stage.focus .w:not(.on), .stage.focus .wl:not(.on) { opacity: .12; }
.stage.focus .card:not(.on) { opacity: .5; }
.w.on .wire { stroke: #2f6fed; stroke-width: 2; }
.wl.on .wlabel-bg { stroke: #2f6fed; }
.card.on { border-color: #2f6fed; box-shadow: 0 0 0 3px rgba(47,111,237,.16), var(--shadow); }

/* Key entries only a diagram has. */
.legend .tile { width: 18px; height: 18px; border-radius: 4px; display: inline-grid; place-items: center; color: #fff; vertical-align: middle; margin-right: 5px; }
.legend .tile svg { width: 11px; height: 11px; }
.legend .arrow { display: inline-block; width: 40px; height: 1.4px; background: var(--wire); position: relative; vertical-align: middle; margin-right: 6px; }
.legend .arrow::after { content: ""; position: absolute; right: -1px; top: -4px; border: 5px solid transparent; border-left: 7px solid var(--wire); }
.legend .hint { color: var(--muted); }
/* On paper a diagram that fits a page stays on one, and nothing can be pointed at. */
@media print { .stage { break-inside: avoid; } .legend .hint { display: none; } }
/* @shared:end diagram.css */

/* The document itself: a lead, then numbered sections of short blocks. Prose keeps a readable measure;
   diagrams and tables take the page's width. */
main { max-width: 1180px; }
nav.crumbs a.here { color: var(--ink); font-weight: 600; text-decoration: none; }
.lead { margin: 0; padding: 16px 24px 0; max-width: 808px; font-size: 15.5px; line-height: 1.5; }
section h2 .n { color: var(--ink); margin-right: 6px; }
section h3 { font-size: 13px; margin: 14px 0 6px; }
section h3:first-child { margin-top: 0; }
section p, section ul, section ol { max-width: 760px; margin: 0 0 10px; }
section ul, section ol { padding-left: 20px; }
section li { margin: 3px 0; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #eef1f5; border-radius: 4px; padding: 1px 4px; }
.wrap { margin: 0 0 12px; }
td:first-child { font-weight: 600; white-space: nowrap; }
td .chip { margin: 0 4px 2px 0; }
/* A diagram keeps the stage's own gutter, so it lines up with the text above it. */
.figure { margin: 0 -24px 4px; }
.figure .legend { margin-bottom: 8px; }
/* Decisions and risks: one card each. */
.entries { display: grid; gap: 10px; max-width: 900px; margin: 0 0 12px; }
.entry { background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 12px 14px; break-inside: avoid; }
.entry .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.entry .id { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.entry .top b { font-size: 13.5px; }
.entry dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 8px 0 0; font-size: 12.5px; }
.entry dt { color: var(--muted); }
.entry dd { margin: 0; }
.entry .on { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
footer { padding-top: 24px; }
@media print { tr { break-inside: avoid; } section h2 { break-after: avoid; } }
</style>
</head>
<body>
<header><h1 id="title"></h1><div class="sub" id="subtitle"></div></header>
<nav class="crumbs" id="crumbs"></nav>
<div class="meta" id="meta"></div>
<main id="doc"></main>
<footer id="footer"></footer>
<script>
// The agent replaces the three placeholders. MODEL is the C4 model.json, DOC is this document's JSON,
// NAV lists the sibling pages as [{"title":"Diagrams","href":"../c4/index.html"}, ...]; "here": true marks this one.
const MODEL = /*__MODEL__*/{};
const DOC = /*__DOC__*/{ "type": "hld", "sections": [] };
const NAV = /*__NAV__*/[];

/* @shared:begin model.js (edit shared/model.js, then run tools/stamp.py) */
// Helpers over the C4 model. Needs `const MODEL` above it.
const ICON = {
  person: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>',
  external: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 12h8M13 9l3 3-3 3"/></svg>',
  app: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>',
  web: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/></svg>',
  mobile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>',
  store: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>',
  queue: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="4" height="10"/><rect x="10" y="7" width="4" height="10"/><rect x="17" y="7" width="4" height="10"/></svg>',
  function: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  component: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="4" width="14" height="7" rx="1.5"/><rect x="7" y="13" width="14" height="7" rx="1.5"/><path d="M3 7.5h4M3 16.5h4"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>',
  zoom: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M11 8v6M8 11h6"/></svg>',
  // tag category icons
  tech: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>',
  region: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
  env: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/></svg>',
  team: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M15 19c0-3 2-4 4-4s3 1 3 4"/></svg>',
  risk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 3l10 18H2L12 3zM12 10v5M12 18h.01"/></svg>',
  other: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12l8-8h8v8l-8 8z"/></svg>'
};
const TYPE_LABEL = { person: "Person", system: "Software System", container: "Container", component: "Component" };
const KIND_LABEL = { person: "Person", system: "Software System", external: "External System", app: "Application",
  web: "Web App", mobile: "Mobile App", store: "Data Store", queue: "Queue / Topic", function: "Function", component: "Component" };

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const els = MODEL.elements || [];
const byId = Object.fromEntries(els.map(e => [e.id, e]));
const system = els.find(e => e.type === "system" && !e.external) || { id: "system", name: MODEL.project || "System" };
const kindOf = e => e.type === "person" ? "person" : e.type === "system" ? (e.external ? "external" : "system")
  : e.type === "component" ? "component" : (e.kind || "app");
const nameOf = id => (byId[id] || { name: id }).name;
// data-tip holds the tooltip's HTML. Build it from escaped text; tipAttr escapes it once more for the attribute.
const tipAttr = html => html ? ` data-tip="${esc(html)}"` : "";
const elementTip = id => { const e = byId[id]; return e ? `<b>${esc(e.name)}</b><div class="t">[${esc(TYPE_LABEL[e.type] + (e.technology ? ": " + e.technology : ""))}]</div>${e.description ? `<div>${esc(e.description)}</div>` : ""}` : ""; };

// Roll an endpoint up to the abstraction a view shows. A relationship recorded against a
// component is still a relationship of its container at the container level.
// `container` is the one a component view looks inside; its own components stay as they are.
function rollUp(id, level, container) {
  let e = byId[id]; if (!e) return id;
  if (level === "context") { while (e && (e.type === "component" || e.type === "container")) e = byId[e.parent]; return e ? e.id : system.id; }
  if (level === "container") { if (e.type === "component") return e.parent; }
  if (level === "component") { if (e.type === "component" && e.parent !== container) return e.parent; }
  return e.id;
}

// Collapse relationships to a level and merge duplicates between the same pair.
function mergeFlows(level, container) {
  const merged = new Map();
  for (const r of MODEL.relationships || []) {
    const from = rollUp(r.from, level, container), to = rollUp(r.to, level, container);
    if (from === to) continue;
    const k = from + "→" + to, m = merged.get(k) || { from, to, labels: [], techs: [] };
    if (r.label && !m.labels.includes(r.label)) m.labels.push(r.label);
    if (r.technology && !m.techs.includes(r.technology)) m.techs.push(r.technology);
    merged.set(k, m);
  }
  return [...merged.values()];
}

const chip = (cls, text, icon, tip) => `<span class="chip ${cls}"${tipAttr(tip)}>${icon ? ICON[icon] || "" : ""}${esc(text)}</span>`;
// A tag is "category:value"; an unknown category draws as "other" and says its category when pointed at.
const TAG_LABEL = { tech: "Technology", region: "Region", env: "Environment", team: "Team", risk: "Risk", other: "Tag" };
const tagChip = tag => {
  const [cat, ...rest] = String(tag).includes(":") ? String(tag).split(":") : ["other", tag], c = ICON[cat] ? cat : "other", value = rest.join(":").trim();
  return chip(c, value, c, `<b>${esc(TAG_LABEL[cat] || cat[0].toUpperCase() + cat.slice(1))}</b><div>${esc(value)}</div>`);
};
/* @shared:end model.js */
/* @shared:begin diagram.js (edit shared/diagram.js, then run tools/stamp.py) */
// The diagram engine: diagram(host, view) draws one C4 view into any element, as many per page as wanted.
// Needs the model helpers above it. view is {"level":"container"} or {"level":"component","container":"api"}.
const LEVELS = {
  context: { title: "System Context diagram", scope: "The whole software system", primary: "The software system",
    supporting: "People and external systems that use or are used by it", audience: "Everyone, technical or not" },
  container: { title: "Container diagram", scope: "Inside the system boundary", primary: "Containers (apps and data stores)",
    supporting: "People and external systems connected to them", audience: "Developers, architects, operations" },
  component: { title: "Component diagram", scope: "Inside one container", primary: "Components of that container",
    supporting: "Containers, people and systems they talk to", audience: "Developers and architects" }
};
// Paper: lay the diagram out at `layout` px, where the side column fits, then scale it to `fit` px (A4 inside 12mm margins).
const PRINT = { layout: 1180, fit: 700 };

// Decide what a view shows: people on top, the boundary in the middle, supporting systems at the side.
function buildView(view) {
  const level = view.level || "context";
  const people = els.filter(e => e.type === "person");
  const externals = els.filter(e => e.type === "system" && e.external);
  const subject = byId[view.container] || {};
  let inside, boundary, side;
  if (level === "context") {
    inside = [system]; boundary = null; side = externals;
  } else if (level === "container") {
    inside = els.filter(e => e.type === "container" && e.parent === system.id);
    boundary = { label: system.name, type: "Software System" }; side = externals;
  } else {
    inside = els.filter(e => e.type === "component" && e.parent === subject.id);
    boundary = { label: subject.name, type: "Container" + (subject.technology ? ": " + subject.technology : "") };
    side = [];  // filled below: only the neighbours that actually connect to a component
  }
  const ins = new Set(inside.map(e => e.id));
  let edges = mergeFlows(level, view.container).filter(e => level !== "component" || ins.has(e.from) || ins.has(e.to));
  if (level === "component") {
    const seen = new Set();
    for (const e of edges) for (const id of [e.from, e.to]) if (!ins.has(id) && byId[id] && !seen.has(id)) { seen.add(id); if (byId[id].type !== "person") side.push(byId[id]); }
  }
  const visible = new Set([...people, ...inside, ...side].map(e => e.id));
  edges = edges.filter(e => visible.has(e.from) && visible.has(e.to));
  const peopleShown = people.filter(p => level === "context" || edges.some(e => e.from === p.id || e.to === p.id));
  const name = level === "component" ? subject.name : system.name;

// Rank the inside elements into layers so arrows mostly flow downward: entry points first.
function layers(inside, edges) {
  const ids = new Set(inside.map(e => e.id)), rank = new Map();
  const preds = id => edges.filter(e => e.to === id && ids.has(e.from)).map(e => e.from);
  const fromOutside = id => edges.some(e => e.to === id && !ids.has(e.from));
  let queue = inside.filter(e => fromOutside(e.id) || preds(e.id).length === 0).map(e => e.id);
  if (!queue.length) queue = [inside[0].id];
  queue.forEach(id => rank.set(id, 0));
  for (let i = 0; i < queue.length; i++) for (const e of edges) if (e.from === queue[i] && ids.has(e.to) && !rank.has(e.to)) { rank.set(e.to, rank.get(queue[i]) + 1); queue.push(e.to); }

}

// What a relationship says when it is pointed at: both ends, every intent, the technology.
const flowTip = e => `<b>${esc(nameOf(e.from))} → ${esc(nameOf(e.to))}</b>${(e.labels.length ? e.labels : ["Uses"]).map(l => `<div>${esc(l)}</div>`).join("")}${e.techs.length ? `<div class="t">${esc(e.techs.join(", "))}</div>` : ""}`;

// view.componentPages lists the containers that have a page of their own to link to.
function card(e, v, view) {

  const rels = v.edges.filter(r => r.from === e.id || r.to === e.id);
  const typeLine = TYPE_LABEL[e.type] + (e.technology ? ": " + e.technology : "");
  const linked = (view.componentPages || []).includes(e.id);
  const zoomTip = `<b>${comps.length} component${comps.length === 1 ? "" : "s"}</b><div>${esc(comps.map(c => c.name).join(", "))}</div>${linked ? '<div class="t">Click to open its diagram</div>' : ""}`;
  const zoom = comps.length && e.type === "container" ? `<span class="badge tl"${tipAttr(zoomTip)}>${linked ? `<a href="component-${esc(e.id)}.html">${ICON.zoom}</a>` : ICON.zoom} ${comps.length}</span>` : "";
  const relTip = `<b>${rels.length} relationship${rels.length === 1 ? "" : "s"} here</b>${rels.map(r => `<div>${r.from === e.id ? "→ " + esc(nameOf(r.to)) : "← " + esc(nameOf(r.from))}: ${esc(r.labels.join(" / ") || "Uses")}</div>`).join("")}`;

    ${zoom}<span class="badge tr"${tipAttr(relTip)}><span class="dot"></span>${rels.length}</span>
    <div class="head"><div class="tile k-${kind}">${ICON[kind]}</div><div><div class="name">${esc(e.name)}</div><div class="type">[${esc(typeLine)}]</div></div></div>
    ${e.description ? `<div class="desc">${esc(e.description)}</div>` : ""}
    <div class="foot"><span class="type">${esc(KIND_LABEL[kind])}</span>${internal ? `<span class="lock"${tipAttr("Inside the system boundary")}>${ICON.lock}</span>` : ""}</div>
    ${(e.tags || []).length ? `<div class="chips">${e.tags.map(tagChip).join("")}</div>` : ""}
  </div>`;
}

function legend(v) {
  const shown = [...v.people, ...v.inside, ...v.side];
  const kinds = [...new Set(shown.map(kindOf))];
  const cats = [...new Set(shown.flatMap(e => (e.tags || []).map(t => String(t).includes(":") ? t.split(":")[0] : "other")))];
  return `<h2>Key</h2><div class="items">
    ${kinds.map(k => `<span><span class="tile k-${k}">${ICON[k]}</span>${esc(KIND_LABEL[k])}</span>`).join("")}
    ${v.boundary ? `<span><span style="display:inline-block;width:22px;height:14px;border:1.5px dashed var(--boundary-line);background:var(--boundary);border-radius:3px;vertical-align:middle;margin-right:5px"></span>${esc(v.boundary.type.split(":")[0])} boundary</span>` : ""}
    <span><span class="arrow"></span>Relationship: intent [technology]</span>
    <span>${ICON.lock.replace("<svg", '<svg style="width:13px;height:13px;vertical-align:middle;color:#9aa5b4;margin-right:4px"')}Inside the boundary</span>

// A label is measured before it is drawn, so the router can give it room.
const ruler = document.createElement("canvas").getContext("2d");

  let w = 0; for (const l of lines) { ruler.font = `${l.tech ? 10 : 11}px ${family}`; w = Math.max(w, ruler.measureText(l.t).width); }

// An orthogonal path through the points, with its corners rounded.
function rounded(points, r = 7) {

// Route every relationship as an orthogonal wire that stays out of the cards, then draw it.

//   - Between rows a wire runs along a lane in the gap; wires that do not overlap share a lane.
//   - A wire to the side column runs down a track of its own in the corridor, and its label sits beside the card it points to.

    .forEach(c => { const r = rows[rows.length - 1]; if (r && c.t < r.t + 20) { r.cards.push(c); c.row = rows.length - 1; } else { rows.push({ t: c.t, cards: [c] }); c.row = rows.length - 1; } });

    else if (on === "r") { const step = Math.min(16, (c.b - c.t - 30) / m); list.forEach((q, j) => set(q, c.r, c.cy + (j - (m - 1) / 2) * step)); }
    else {   // the left edge of a side card: each label sits beside its port, so ports are as far apart as their labels are tall
      const hs = list.map(q => Math.max(20, q.p.label.h + 8)), total = hs.reduce((x, y) => x + y, 0), squeeze = Math.min(1, (c.b - c.t - 12) / total);
      let y = c.cy - total * squeeze / 2; list.forEach((q, j) => { set(q, c.l, y + hs[j] * squeeze / 2); y += hs[j] * squeeze; });

  // 3. Lanes and columns. A lane is taken for a stretch of x, so wires that do not overlap share one.
  const lanes = {}, used = {}, columns = [];

      if (ga === gb || straight(B.x)) { const y = labelled(p, ga, A.x, B.x); p.pts = [[A.x, A.y], [A.x, y], [B.x, y], [B.x, B.y]]; }

    + plans.map(p => { const d = rounded(p.pts); return `<g class="w" data-w="${p.i}"${tip(p)}><path class="hit" d="${d}"/><path class="wire" d="${d}" marker-end="url(#arr${n})"/></g>`; }).join("")

  return true;
}

// Draw one view into host and keep its wires right as the host resizes or prints. Returns the view that was drawn.
let diagrams = 0;

  host.innerHTML = `<div class="stage"></div><div class="legend">${legend(v)}</div>`;
  const stage = host.firstChild;
  const draw = () => { for (let i = 0; i < 80 && !wires(stage, v.edges, n); i++); };
  const paint = () => {
    const inner = `<div class="layers">${layers(v.inside, v.edges).map(l => `<div class="layer">${l.map(e => card(e, v, view)).join("")}</div>`).join("")}</div>`;
    stage.innerHTML = `<svg class="wires"></svg>
     <div class="row people">${v.people.map(e => card(e, v, view)).join("")}</div>
     <div class="mid${v.side.length ? "" : " no-side"}">
       ${v.boundary ? `<div class="boundary"><span class="blabel"><b>${esc(v.boundary.label)}</b> [${esc(v.boundary.type)}]</span>${inner}</div>` : `<div class="boundary" style="border:0;background:none;padding:0">${inner}</div>`}
       ${v.side.length ? `<aside class="side"><div class="slabel">[${v.level === "component" ? "Related" : "External systems"}]</div>${v.side.map(e => card(e, v, view)).join("")}</aside>` : ""}
     </div>`;
    stage.querySelectorAll(".people .card").forEach(c => { c.dataset.zone = "p"; c.dataset.rank = -1; });
    stage.querySelectorAll(".layer").forEach((l, i) => l.querySelectorAll(".card").forEach(c => { c.dataset.zone = "in"; c.dataset.rank = i; }));

  // Pointing at a wire lights it and its two ends; pointing at a card lights everything it talks to.
  const light = hot => {
    const on = new Set(hot), ends = new Set(hot.flatMap(i => [v.edges[i].from, v.edges[i].to]));
    stage.classList.toggle("focus", on.size > 0);
    stage.querySelectorAll("[data-w]").forEach(g => {
      const lit = on.has(+g.dataset.w), line = g.querySelector(".wire"); g.classList.toggle("on", lit);
      if (line) line.setAttribute("marker-end", `url(#arr${n}${lit ? "on" : ""})`);
    });
    stage.querySelectorAll(".card").forEach(c => c.classList.toggle("on", ends.has(c.dataset.id)));
  };
  stage.addEventListener("pointerover", e => {
    const wire = e.target.closest("[data-w]"), box = e.target.closest(".card");
    light(wire ? [+wire.dataset.w] : box ? v.edges.flatMap((x, i) => x.from === box.dataset.id || x.to === box.dataset.id ? [i] : []) : []);
  });
  stage.addEventListener("pointerleave", () => light([]));
  return v;
}
/* @shared:end diagram.js */
/* @shared:begin tip.js (edit shared/tip.js, then run tools/stamp.py) */
// One tooltip for the page. Anything carrying data-tip shows it while the pointer is over it.
(() => {
  const tip = document.body.appendChild(Object.assign(document.createElement("div"), { className: "tip", hidden: true }));
  let over = null;
  const hide = () => { over = null; tip.hidden = true; };
  addEventListener("pointermove", e => {
    const el = e.target.closest ? e.target.closest("[data-tip]") : null;
    if (el !== over) { over = el; tip.hidden = !el; if (el) tip.innerHTML = el.dataset.tip; }
    if (!el) return;
    const w = tip.offsetWidth, h = tip.offsetHeight;   // beside the pointer, kept inside the window
    tip.style.left = Math.max(8, Math.min(e.clientX + 14, innerWidth - w - 8)) + "px";
    tip.style.top = (e.clientY + 18 + h > innerHeight ? e.clientY - h - 10 : e.clientY + 18) + "px";
  });
  addEventListener("scroll", hide, true); addEventListener("beforeprint", hide);
  document.documentElement.addEventListener("pointerleave", hide);
})();
/* @shared:end tip.js */

// What each type is for. The same three lines open reference/<type>.md.
const TYPES = {
  hld: { title: "High-Level Design", reader: "Executives, product, new joiners", answers: "What is it, who is it for, what could hurt it?", scope: "The whole system" },
  sad: { title: "Solution Architecture", reader: "Architects, tech leads, reviewers", answers: "Why this shape, and does it meet its goals?", scope: "The whole solution" },
  tdd: { title: "Technical Design", reader: "Engineers who build and run it", answers: "How does it work, how do I change and run it?", scope: "One container" }
};
const T = TYPES[DOC.type] || TYPES.hld, subject = byId[DOC.subject] || system;
const human = id => String(id).replace(/-/g, " ").replace(/^./, c => c.toUpperCase());
// Hand-written text is plain, except `code` between backticks.
const say = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const on = ids => (ids || []).length ? `<div class="on">${ids.map(id => chip("other", nameOf(id), null, elementTip(id))).join("")}</div>` : "";
const heading = b => b.title ? `<h3>${say(b.title)}</h3>` : "";
const table = (columns, rows) => `<div class="wrap"><table><tr>${columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
const typeLine = e => esc(TYPE_LABEL[e.type] + (e.technology ? ": " + e.technology : ""));

// One function per block kind. diagram, elements and flows are drawn from the model, so nothing is typed twice.
const BLOCKS = {
  text: b => `<p>${say(b.text)}</p>`,
  list: b => heading(b) + `<${b.ordered ? "ol" : "ul"}>${(b.items || []).map(i => `<li>${say(i)}</li>`).join("")}</${b.ordered ? "ol" : "ul"}>`,
  table: b => heading(b) + table(b.columns || [], (b.rows || []).map(r => r.map(say))),
  diagram: b => `<div class="figure" data-level="${esc(b.level)}"></div>`,
  elements: b => {
    const rows = b.of === "externals" ? els.filter(e => e.type === "system" && e.external) : els.filter(e => e.type === "container" && e.parent === system.id);
    return table(["Name", "Type and technology", "What it does", "Tags"], rows.map(e => [esc(e.name), typeLine(e), esc(e.description), (e.tags || []).map(tagChip).join("")]));
  },
  flows: () => {
    const shown = new Set(els.filter(e => e.type !== "component" && e.id !== system.id).map(e => e.id));
    const rows = mergeFlows("container").filter(f => shown.has(f.from) && shown.has(f.to) && (DOC.type !== "tdd" || f.from === subject.id || f.to === subject.id));
    return table(["From", "To", "Intent", "Technology"], rows.map(f => [esc(nameOf(f.from)), esc(nameOf(f.to)), esc(f.labels.join(" / ") || "Uses"), `<span class="tech">${esc(f.techs.join(", ") || "unspecified")}</span>`]));
  },
  decisions: b => `<div class="entries">${(b.items || []).map(d => `<div class="entry">
    <div class="top"><span class="id">${esc(d.id)}</span><b>${say(d.title)}</b></div>
    <dl><dt>Decision</dt><dd>${say(d.decision)}</dd><dt>Why</dt><dd>${say(d.why)}</dd>${d.alternatives ? `<dt>Instead of</dt><dd>${say(d.alternatives)}</dd>` : ""}</dl>${on(d.elements)}
  </div>`).join("")}</div>`,
  risks: b => `<div class="entries">${(b.items || []).map(r => `<div class="entry">
    <div class="top"><span class="id">${esc(r.id)}</span>${chip(r.impact, human(r.impact))}<b>${say(r.title)}</b></div>
    <dl><dt>Response</dt><dd>${say(r.mitigation)}</dd></dl>${on(r.elements)}
  </div>`).join("")}</div>`
};

const title = `${T.title}: ${subject.name}`;
document.title = title;
document.getElementById("title").textContent = title;
document.getElementById("subtitle").textContent = (MODEL.project ? MODEL.project + " · " : "") + (MODEL.description || "");
document.getElementById("crumbs").innerHTML = NAV.map(n => n.here ? `<a class="here">${esc(n.title)}</a>` : `<a href="${esc(n.href)}">${esc(n.title)}</a>`).join(" · ");
document.getElementById("meta").innerHTML =
  `<span><b>Reader</b>${esc(T.reader)}</span><span><b>Answers</b>${esc(T.answers)}</span><span><b>Scope</b>${esc(T.scope)}</span>`
  + `<span><b>Status</b>${esc(human(DOC.status || "draft"))}</span><span><b>Version</b>${esc(DOC.version || "0.1")}</span><span><b>Owner</b>${esc(DOC.owner || "Not determined")}</span>`;
document.getElementById("doc").innerHTML = (DOC.summary ? `<p class="lead">${say(DOC.summary)}</p>` : "")
  + (DOC.sections || []).map((s, i) => `<section id="${esc(s.id)}"><h2><span class="n">${i + 1}</span>${esc(human(s.id))}</h2>${(s.blocks || []).map(b => (BLOCKS[b.kind] || (() => ""))(b)).join("")}</section>`).join("");
document.querySelectorAll(".figure").forEach(f => diagram(f, { level: f.dataset.level, container: DOC.subject }));
document.getElementById("footer").textContent = `Generated ${DOC.generated || MODEL.generated || new Date().toISOString().slice(0, 10)} · ${T.title} · drawn from the C4 model`;
</script>
</body>
